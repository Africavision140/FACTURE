<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Africa Vision — Facturation</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12306e">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="AV Facturation">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  :root {
    --bleu: #12306e;
    --bleu-fonce: #0a1c46;
    --bleu-clair: #eef3fc;
    --bleu-entete: #c9d7ef;
    --or: #c8991f;
    --or-fonce: #9a7415;
    --or-clair: #fbf3dc;
    --bordure: #ccd8ee;
    --texte: #1b1b1b;
    --texte-mute: #5c6b78;
    --rouge: #b3413a;
    --vert: #1f6b47;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f2f4f6;
    color: var(--texte);
    margin: 0;
    padding: 0;
  }

  /* ===== BOUTONS ===== */
  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    padding: 10px 16px;
  }
  .btn-principal { background: var(--bleu); color: #fff; }
  .btn-principal:hover { background: var(--bleu-fonce); }
  .btn-secondaire { background: #fff; color: var(--bleu); border: 1px solid var(--bleu); }
  .btn-secondaire:hover { background: var(--bleu-clair); }
  .btn-or { background: var(--or); color: #fff; }
  .btn-or:hover { background: var(--or-fonce); }
  .btn-danger { background: #fff; color: var(--rouge); border: 1px solid #f0c9c6; padding: 6px 10px; font-size: 12px; }
  .btn-danger:hover { background: #fbeae9; }
  .btn-whatsapp { background: #1f9d55; color: #fff; }
  .btn-whatsapp:hover { background: #187c43; }

  /* ===== APP ===== */
  #app { max-width: 900px; margin: 0 auto; padding: 16px; }

  .entete {
    background: linear-gradient(135deg, var(--bleu-entete) 0%, #ffffff 60%);
    border: 1px solid var(--bordure);
    border-bottom: 3px solid var(--or);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    flex-wrap: wrap;
  }
  .entete h2 { margin: 0 0 2px; font-size: 20px; color: var(--bleu-fonce); letter-spacing: .5px; }
  .zh { font-family: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Heiti SC", sans-serif; }

  /* ===== BLOC IDENTITE (ecran + impression + PDF) ===== */
  .ident-zh { font-size: 19px; font-weight: 700; color: var(--bleu-fonce); margin: 0 0 1px; letter-spacing: 1px; }
  .ident-en { font-size: 12px; font-weight: 700; color: var(--bleu-fonce); letter-spacing: .4px; margin: 0 0 6px; }
  .ident-contact { font-size: 15px; font-weight: 700; font-style: italic; color: var(--or-fonce); letter-spacing: 1px; margin: 0 0 4px; }
  .ident-tels { font-size: 12.5px; color: var(--texte); line-height: 1.65; margin-bottom: 6px; }
  .ident-tels .canal { color: var(--texte-mute); font-size: 11px; }
  .ident-adresse { font-size: 11.5px; color: var(--texte-mute); line-height: 1.55; }
  .ident-adresse .titre { color: var(--bleu); font-weight: 700; font-size: 12px; }
  .ident-qr { text-align: center; font-size: 10px; color: var(--texte-mute); }
  .ident-qr img { width: 84px; height: 84px; display: block; margin-bottom: 2px; }
  .entete .activite { font-size: 13px; color: var(--texte-mute); margin: 0 0 8px; }
  .entete .coord { font-size: 12px; color: var(--texte-mute); line-height: 1.55; }

  .badge-facture {
    background: var(--bleu);
    color: #fff;
    font-weight: 700;
    letter-spacing: 2px;
    font-size: 13px;
    padding: 8px 16px;
    border-radius: 6px;
    white-space: nowrap;
  }
  .badge-facture.paye { background: var(--vert); }

  .badge-facture-impression {
    display: inline-block;
    background: var(--bleu);
    color: #fff;
    font-weight: 700;
    letter-spacing: 2px;
    font-size: 12px;
    padding: 6px 14px;
    border-radius: 5px;
  }
  .badge-facture-impression.paye { background: var(--vert); }

  /* ===== ONGLETS ===== */
  .onglets { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .onglet {
    background: #fff; border: 1px solid var(--bordure); border-radius: 8px;
    padding: 9px 16px; font-size: 14px; font-weight: 600; color: var(--texte-mute); cursor: pointer;
  }
  .onglet.actif { background: var(--bleu); color: #fff; border-color: var(--bleu); }

  .panneau {
    background: #fff;
    border: 1px solid var(--bordure);
    border-radius: 12px;
    padding: 20px;
  }

  /* ===== ENTETE IMPRESSION ===== */
  .entete-impression { display: none; border-bottom: 2px solid var(--or); padding-bottom: 10px; margin-bottom: 14px; }

  /* ===== CHAMPS ===== */
  label { display: block; font-size: 12px; font-weight: 600; color: var(--texte-mute); margin-bottom: 4px; }
  input, select {
    width: 100%; padding: 9px 10px; font-size: 14px; font-family: inherit;
    border: 1px solid var(--bordure); border-radius: 6px; background: #fff; color: var(--texte);
  }
  input:focus, select:focus { outline: 2px solid var(--bleu); outline-offset: -1px; }
  input[readonly] { background: var(--bleu-clair); font-weight: 600; color: var(--bleu-fonce); }
  .ligne-champs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
  @media (max-width: 600px) { .ligne-champs { grid-template-columns: 1fr; } }

  /* ===== TABLEAU ARTICLES ===== */
  .tableau-articles { width: 100%; border-collapse: collapse; margin-top: 6px; }
  .tableau-articles th {
    background: var(--bleu-clair); color: var(--bleu-fonce); font-size: 12px;
    text-align: left; padding: 8px 10px; border: 1px solid var(--bordure);
  }
  .tableau-articles td { border: 1px solid var(--bordure); padding: 0; }
  .tableau-articles td input { border: none; border-radius: 0; padding: 8px 10px; }
  .tableau-articles td input:focus { outline: 2px solid var(--bleu); outline-offset: -2px; }
  .col-num { width: 38px; text-align: center; font-size: 13px; color: var(--texte-mute); padding: 6px !important; }
  .col-qte { width: 90px; }
  .col-pu { width: 130px; }
  .col-montant { width: 140px; text-align: right; }
  .col-suppr { width: 44px; text-align: center; padding: 4px !important; }

  .totaux { display: flex; justify-content: flex-end; margin-bottom: 16px; }
  .totaux table { border-collapse: collapse; min-width: 280px; }
  .totaux td { padding: 6px 10px; font-size: 14px; }
  .totaux td:first-child { color: var(--texte-mute); }
  .totaux td:last-child { text-align: right; font-weight: 700; }
  .totaux tr.total-general td { border-top: 2px solid var(--or); font-size: 17px; color: var(--bleu-fonce); }
  .totaux tr.reste td { color: var(--rouge); }

  .en-lettres { font-size: 13px; font-style: italic; color: var(--texte-mute); margin-bottom: 20px; padding: 10px; background: var(--or-clair); border-radius: 6px; }

  .signatures { display: flex; justify-content: space-between; margin-top: 40px; }
  .signatures div { text-align: center; font-size: 13px; color: var(--texte-mute); width: 45%; }
  .signatures .trait { border-top: 1px solid var(--texte-mute); margin-top: 50px; padding-top: 6px; }

  .pied-page { margin-top: 22px; padding-top: 10px; border-top: 1px solid var(--bordure); font-size: 11px; color: var(--texte-mute); text-align: center; line-height: 1.5; }

  .actions-bas { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }

  /* ===== HISTORIQUE ===== */
  .historique-item {
    background: #fff; border: 1px solid var(--bordure); border-left: 3px solid var(--or); border-radius: 10px; padding: 12px 14px;
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; flex-wrap: wrap; gap: 8px;
  }
  .historique-item .num { font-weight: 700; color: var(--bleu-fonce); font-size: 14px; }
  .historique-item .details { font-size: 12.5px; color: var(--texte-mute); }
  .vide { text-align: center; color: var(--texte-mute); padding: 30px; font-size: 14px; }

  /* ===== IMPRESSION ===== */
  @media print {
    body * { visibility: hidden; }
    #zoneImpression, #zoneImpression *, #zoneImpressionBordereau, #zoneImpressionBordereau * { visibility: visible; }
    #zoneImpression, #zoneImpressionBordereau { position: absolute; top: 0; left: 0; width: 100%; padding: 20px; }
    .onglets, .actions-bas, .btn-danger, #boutonAjouterLigne, .col-suppr { display: none !important; }
    .entete-impression { display: block !important; }
    .badge-facture-impression, .entete, .entete-impression { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>

<!-- ================= APPLICATION ================= -->
<div id="app">

  <div class="entete">
    <div id="identiteEcran" style="flex:1 1 420px;"></div>
    <div class="badge-facture" id="badgeStatut">FACTURE</div>
  </div>

  <div class="onglets">
    <div class="onglet actif" id="ongletNouvelle" onclick="afficherOnglet('nouvelle')">Nouvelle facture</div>
    <div class="onglet" id="ongletHistorique" onclick="afficherOnglet('historique')">Historique</div>
    <div class="onglet" id="ongletBordereau" onclick="afficherOnglet('bordereau')">Bordereau mensuel</div>
  </div>

  <!-- ===== PANNEAU NOUVELLE FACTURE ===== -->
  <div class="panneau" id="panneauNouvelle">
    <div id="zoneImpression">
      <div class="entete-impression">
        <div id="identiteImpression"></div>
        <div class="badge-facture-impression" id="badgeImpression" style="margin-top:8px;">FACTURE</div>
      </div>
      <div class="ligne-champs">
        <div>
          <label>N° Facture</label>
          <input type="text" id="numeroFacture" readonly>
        </div>
        <div>
          <label>Date</label>
          <input type="date" id="dateFacture">
        </div>
      </div>
      <div class="ligne-champs">
        <div>
          <label>Téléphone client</label>
          <div style="display:flex; gap:6px;">
            <input type="tel" id="telephoneClient" placeholder="Ex : 622 00 00 00">
            <button type="button" class="btn-whatsapp" style="padding:0 14px;" onclick="ouvrirWhatsAppClient()" title="Ouvrir la discussion WhatsApp">💬</button>
          </div>
        </div>
        <div>
          <label>Nom du client</label>
          <input type="text" id="nomClient" placeholder="Ex : Mamadou Diallo">
        </div>
      </div>
      <div class="ligne-champs">
        <div>
          <label>Type de prestation</label>
          <select id="typePrestation">
            <option>Billetterie</option>
            <option>Voyage organisé</option>
            <option>Tourisme</option>
            <option>Assistance / Visa</option>
            <option>Cargo</option>
            <option>Transit</option>
            <option>Autre</option>
          </select>
        </div>
        <div>
          <label>Référence dossier / PNR <span style="font-weight:400;">(facultatif)</span></label>
          <input type="text" id="referenceDossier" placeholder="Ex : 6XK9PL">
        </div>
      </div>

      <table class="tableau-articles">
        <thead>
          <tr>
            <th class="col-num">N°</th>
            <th>Désignation</th>
            <th class="col-qte">Quantité</th>
            <th class="col-pu">P. Unitaire</th>
            <th class="col-montant">Montant</th>
            <th class="col-suppr"></th>
          </tr>
        </thead>
        <tbody id="corpsTableau"></tbody>
      </table>
      <button class="btn-secondaire" id="boutonAjouterLigne" onclick="ajouterLigne()">+ Ajouter une ligne</button>

      <div class="totaux" style="margin-top:16px;">
        <table>
          <tr class="total-general"><td>TOTAL</td><td id="afficheTotal">0 GNF</td></tr>
          <tr>
            <td>Payé</td>
            <td><input type="number" id="montantPaye" value="0" style="text-align:right; width:140px;" oninput="recalculer()"></td>
          </tr>
          <tr class="reste"><td>Reste à payer</td><td id="afficheReste">0 GNF</td></tr>
        </table>
      </div>

      <div class="en-lettres">
        Arrêtée la présente facture à la somme de : <span id="montantEnLettres">zéro franc guinéen</span>
      </div>

      <div class="signatures">
        <div><div class="trait">Le Client</div></div>
        <div style="position:relative;">
          <img id="cachetAgence" style="width:92px; opacity:0.92; transform:rotate(-8deg); display:none; margin:0 auto -12px;" alt="Cachet Africa Vision Voyage">
          <div class="trait">Pour l'Agence</div>
        </div>
      </div>

      <div class="pied-page" id="piedPage"></div>
    </div>

    <div class="actions-bas">
      <button class="btn-principal" onclick="enregistrerFacture()">Enregistrer</button>
      <button class="btn-secondaire" onclick="window.print()">Imprimer</button>
      <button class="btn-secondaire" onclick="telechargerPDF()">Télécharger PDF</button>
      <button class="btn-whatsapp" onclick="partagerWhatsApp()">Partager WhatsApp</button>
      <button class="btn-secondaire" onclick="nouvelleFacture()">Nouvelle facture vierge</button>
    </div>
  </div>

  <!-- ===== PANNEAU HISTORIQUE ===== -->
  <div class="panneau" id="panneauHistorique" style="display:none;">
    <div id="listeHistorique"><p class="vide">Chargement...</p></div>
  </div>

  <!-- ===== PANNEAU BORDEREAU MENSUEL ===== -->
  <div class="panneau" id="panneauBordereau" style="display:none;">
    <div class="ligne-champs" style="grid-template-columns: 1fr auto; align-items:end;">
      <div>
        <label>Mois à récapituler</label>
        <input type="month" id="moisBordereau">
      </div>
      <div>
        <button class="btn-principal" onclick="genererBordereau()">Générer</button>
      </div>
    </div>
    <div id="resultatBordereau"><p class="vide">Choisis un mois puis clique sur Générer.</p></div>
  </div>

</div>

  // ==========================================================

  function telephonesHtml() {
    return AGENCE.telephones.map(t =>
      `${t.drapeau} ${t.numero}${t.canal ? ` <span class="canal">(${t.canal})</span>` : ""}`
    ).join("<br>");

  function qrCodesHtml(taille) {
    let html = "";
    if (QR_WHATSAPP_BASE64) {
      html += `<div class="ident-qr"><img src="${QR_WHATSAPP_BASE64}" style="width:${taille}px; height:${taille}px;" alt="QR WhatsApp">WhatsApp</div>`;
    }
    if (QR_WECHAT_BASE64) {
      html += `<div class="ident-qr"><img src="${QR_WECHAT_BASE64}" style="width:${taille}px; height:${taille}px;" alt="QR WeChat">WeChat</div>`;
    }
    return html;
  }

  function blocIdentiteHtml(hauteurLogo, tailleQr) {

      <div style="display:flex; gap:16px; align-items:flex-start; flex-wrap:wrap;">
        <img src="${LOGO_BASE64}" style="height:${hauteurLogo}px; display:block; flex:0 0 auto;" alt="Africa Vision">
        <div style="flex:1 1 300px; min-width:260px;">
          <p class="ident-zh zh">${AGENCE.nomZh}</p>
          <p class="ident-en">${AGENCE.nomEn}</p>
          <p class="ident-contact">${AGENCE.contact}</p>
          <div class="ident-tels">${telephonesHtml()}</div>
          <div class="ident-adresse">
            <span class="titre">Office Add</span><br>
            <span class="zh">${AGENCE.adresseZh}</span><br>

          </div>
          <div class="ident-adresse" style="margin-top:5px;">

  function blocPiedHtml() {
    return `${AGENCE.marque} — ${AGENCE.nomEn}<br><span class="zh">${AGENCE.adresseZh}</span> — ${AGENCE.adresseEn}<br>Guinée : ${AGENCE.adresseGn}<br>${AGENCE.telephones.map(t => t.numero).join(" / ")}`;
  }

  function injecterIdentite() {
    const ecran = document.getElementById("identiteEcran");
    if (ecran) ecran.innerHTML = blocIdentiteHtml(92, 84);
    const impr = document.getElementById("identiteImpression");
    if (impr) impr.innerHTML = blocIdentiteHtml(78, 76);
    const pied = document.getElementById("piedPage");
    if (pied) pied.innerHTML = blocPiedHtml();
    const cachet = document.getElementById("cachetAgence");
    if (cachet && CACHET_BASE64) { cachet.src = CACHET_BASE64; cachet.style.display = "block"; }

  injecterIdentite();

  let lignesArticles = [];
  let compteurLigneId = 0;

  // ==========================================================
  // DEMARRAGE — acces libre, aucun code demande
  // ==========================================================
  function demarrer() {
    initialiserFacture();
    chargerHistorique();
  }
  demarrer();

  // ==========================================================
  // GESTION DES ONGLETS
  // ==========================================================
  function afficherOnglet(nom) {
    document.getElementById("panneauNouvelle").style.display = nom === "nouvelle" ? "block" : "none";
    document.getElementById("panneauHistorique").style.display = nom === "historique" ? "block" : "none";
    document.getElementById("panneauBordereau").style.display = nom === "bordereau" ? "block" : "none";
    document.getElementById("ongletNouvelle").classList.toggle("actif", nom === "nouvelle");
    document.getElementById("ongletHistorique").classList.toggle("actif", nom === "historique");
    document.getElementById("ongletBordereau").classList.toggle("actif", nom === "bordereau");
    if (nom === "historique") chargerHistorique();
    if (nom === "bordereau" && !document.getElementById("moisBordereau").value) {
      document.getElementById("moisBordereau").value = new Date().toISOString().slice(0, 7);
    }
  }

  // ==========================================================
  // GESTION DES LIGNES D'ARTICLES
  // ==========================================================
  function ajouterLigne(designation, quantite, prixUnitaire) {
    compteurLigneId++;
    lignesArticles.push({
      id: compteurLigneId,
      designation: designation || "",
      quantite: quantite || 1,
      prixUnitaire: prixUnitaire || 0
    });
    redessinerTableau();
  }

  function supprimerLigne(id) {
    lignesArticles = lignesArticles.filter(l => l.id !== id);
    redessinerTableau();
  }

  function echapper(t) {
    return String(t == null ? "" : t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function redessinerTableau() {
    const corps = document.getElementById("corpsTableau");
    corps.innerHTML = "";
    lignesArticles.forEach((ligne, index) => {
      const tr = document.createElement("tr");
      tr.setAttribute("data-id", ligne.id);
      tr.innerHTML = `
        <td class="col-num">${index + 1}</td>
        <td><input type="text" value="${echapper(ligne.designation)}" placeholder="Ex : Billet Conakry — Dakar (aller-retour)" oninput="majLigne(${ligne.id}, 'designation', this.value)"></td>
        <td class="col-qte"><input type="number" value="${ligne.quantite}" min="0" style="text-align:right" oninput="majLigne(${ligne.id}, 'quantite', this.value)"></td>
        <td class="col-pu"><input type="number" value="${ligne.prixUnitaire}" min="0" style="text-align:right" oninput="majLigne(${ligne.id}, 'prixUnitaire', this.value)"></td>
        <td class="col-montant cellule-montant" style="text-align:right; padding:6px 10px; font-weight:600;">${formatMontant(ligne.quantite * ligne.prixUnitaire)}</td>
        <td class="col-suppr"><button class="btn-danger" onclick="supprimerLigne(${ligne.id})">✕</button></td>
      `;
      corps.appendChild(tr);
    });
    recalculer();
  }

  function majLigne(id, champ, valeur) {
    const ligne = lignesArticles.find(l => l.id === id);
    if (!ligne) return;
    ligne[champ] = (champ === "designation") ? valeur : Number(valeur);
    if (champ !== "designation") {
      const celluleMontant = document.querySelector(`tr[data-id="${id}"] .cellule-montant`);
      if (celluleMontant) celluleMontant.textContent = formatMontant(ligne.quantite * ligne.prixUnitaire);
    }
    recalculer();
  }

  function recalculer() {
    const total = lignesArticles.reduce((somme, l) => somme + (l.quantite * l.prixUnitaire), 0);
    const paye = Number(document.getElementById("montantPaye").value) || 0;
    const reste = Math.max(total - paye, 0);
    document.getElementById("afficheTotal").textContent = formatMontant(total) + " GNF";
    document.getElementById("afficheReste").textContent = formatMontant(reste) + " GNF";
    document.getElementById("montantEnLettres").textContent = nombreEnLettres(total) + " francs guinéens";

    const estPaye = total > 0 && reste === 0;
    [document.getElementById("badgeStatut"), document.getElementById("badgeImpression")].forEach(badge => {
      if (!badge) return;
      badge.textContent = estPaye ? "REÇU" : "FACTURE";
      badge.classList.toggle("paye", estPaye);
    });
  }

  function formatMontant(n) {
    return Math.round(n).toLocaleString("fr-FR");
  }

  // ==========================================================
  // NOUVELLE FACTURE VIERGE
  // ==========================================================
  async function nouvelleFacture() {
    document.getElementById("nomClient").value = "";
    document.getElementById("telephoneClient").value = "";
    document.getElementById("referenceDossier").value = "";
    document.getElementById("typePrestation").selectedIndex = 0;
    document.getElementById("montantPaye").value = 0;
    document.getElementById("dateFacture").value = new Date().toISOString().split("T")[0];
    lignesArticles = [];
    ajouterLigne();
    await genererNumeroFacture();
  }

  async function initialiserFacture() {
    document.getElementById("dateFacture").value = new Date().toISOString().split("T")[0];
    ajouterLigne();
    await genererNumeroFacture();
  }

  async function genererNumeroFacture() {
    const annee = new Date().getFullYear();
    let dernier = 0;
    try {
      const res = await fetch(`${BASE_URL}/${DOC_COMPTEUR}?key=${API_KEY}`);
      if (res.ok) {
        const data = await res.json();
        dernier = Number(data.fields?.valeur?.integerValue || 0);
      }
    } catch (e) { console.error("Lecture compteur échouée", e); }
    const numero = `${PREFIXE_NUMERO}-${annee}-${String(dernier + 1).padStart(3, "0")}`;
    document.getElementById("numeroFacture").value = numero;
  }

  // ==========================================================
  // ENREGISTREMENT (Firestore REST)
  // ==========================================================
  async function enregistrerFacture() {
    const numero = document.getElementById("numeroFacture").value;
    const total = lignesArticles.reduce((s, l) => s + (l.quantite * l.prixUnitaire), 0);
    const paye = Number(document.getElementById("montantPaye").value) || 0;

    const donnees = {
      numero: numero,
      date: document.getElementById("dateFacture").value,
      client: document.getElementById("nomClient").value,
      telephone: document.getElementById("telephoneClient").value,
      prestation: document.getElementById("typePrestation").value,
      reference: document.getElementById("referenceDossier").value,
      articles: lignesArticles.map(l => ({ designation: l.designation, quantite: l.quantite, prixUnitaire: l.prixUnitaire })),
      total: total,
      paye: paye,
      reste: Math.max(total - paye, 0)
    };

    try {
      await fetch(`${BASE_URL}/${COLLECTION_FACTURES}?key=${API_KEY}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ fields: versChampsFirestore(donnees) })
      });

      const nouveauCompteur = Number(numero.split("-")[2]);
      await fetch(`${BASE_URL}/${DOC_COMPTEUR}?key=${API_KEY}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },

  async function chargerHistorique() {
    const zone = document.getElementById("listeHistorique");
    zone.innerHTML = "<p class='vide'>Chargement...</p>";
    try {
      const res = await fetch(`${BASE_URL}/${COLLECTION_FACTURES}?key=${API_KEY}&pageSize=200`);
      const data = await res.json();
      const documents = (data.documents || [])
        .map(doc => ({ ...depuisDocumentFirestore(doc), _id: doc.name.split("/").pop() }))
        .reverse();

      if (documents.length === 0) {
        zone.innerHTML = "<p class='vide'>Aucune facture enregistrée pour l'instant.</p>";
        return;
      }

      zone.innerHTML = "";
      documents.forEach(f => {
        const div = document.createElement("div");
        div.className = "historique-item";
        const estPaye = f.reste === 0;
        const puceStatut = `<span style="font-size:11px; font-weight:600; padding:2px 8px; border-radius:10px; margin-left:6px; background:${estPaye ? "#dff0e8" : "#fdf1d6"}; color:${estPaye ? "#1f6b47" : "#916a05"};">${estPaye ? "Payé" : "Reste " + formatMontant(f.reste) + " GNF"}</span>`;
        const infoPrestation = f.prestation ? ` • ${echapper(f.prestation)}` : "";
        const infoRef = f.reference ? ` • Réf ${echapper(f.reference)}` : "";
        div.innerHTML = `
          <div>
            <div class="num">${f.numero} ${puceStatut}</div>
            <div class="details">${echapper(f.client) || "Client non renseigné"}${f.telephone ? " • " + echapper(f.telephone) : ""}${infoPrestation}${infoRef} — ${f.date} — Total : ${formatMontant(f.total)} GNF</div>

            <button class="btn-secondaire" onclick='rechargerFacture(${JSON.stringify(JSON.stringify(f))})'>Ouvrir</button>
            <button class="btn-danger" onclick='supprimerFacture("${f._id}", ${JSON.stringify(f.numero)})'>Supprimer</button>
          </div>
        `;
        zone.appendChild(div);
      });
    } catch (e) {
      zone.innerHTML = "<p class='vide'>Impossible de charger l'historique. Vérifie la connexion.</p>";
      console.error(e);
    }
  }

  async function genererPdfDepuisHtml(html, nomFichier) {
    const conteneur = document.createElement("div");
    conteneur.style.width = "700px";
    conteneur.style.maxWidth = "100%";
    conteneur.style.background = "#ffffff";
    conteneur.style.padding = "20px";
    conteneur.style.margin = "0 auto";
    conteneur.innerHTML = html;
    document.body.insertBefore(conteneur, document.body.firstChild);

    // On laisse le temps au navigateur d'afficher réellement ce contenu avant la capture
    await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));

    try {
      await html2pdf().set({
        margin: 8,
        filename: nomFichier,
        image: { type: "jpeg", quality: 0.95 },
        html2canvas: { scale: 2, useCORS: true },
        jsPDF: { unit: "mm", format: "a4", orientation: "portrait" }
      }).from(conteneur).save();
    } catch (e) {
      alert("Erreur lors de la génération du PDF : " + (e && e.message ? e.message : e));
      console.error(e);
    } finally {
      document.body.removeChild(conteneur);
    }
  }

  // ==========================================================
  // CONVERSION FIRESTORE REST <-> OBJET JS
  // ==========================================================
  function versChampsFirestore(obj) {
    const champs = {};
    for (const cle in obj) {
      champs[cle] = versValeurFirestore(obj[cle]);
    }
    return champs;
  }
  function versValeurFirestore(valeur) {
    if (typeof valeur === "string") return { stringValue: valeur };
    if (typeof valeur === "number") return { doubleValue: valeur };
    if (Array.isArray(valeur)) {
      return { arrayValue: { values: valeur.map(v => ({ mapValue: { fields: versChampsFirestore(v) } })) } };
    }
    return { stringValue: String(valeur) };
  }
  function depuisDocumentFirestore(doc) {
    const obj = {};
    const champs = doc.fields || {};
    for (const cle in champs) {
      obj[cle] = depuisValeurFirestore(champs[cle]);
    }
    return obj;
  }
  function depuisValeurFirestore(valeur) {
    if ("stringValue" in valeur) return valeur.stringValue;
    if ("doubleValue" in valeur) return valeur.doubleValue;
    if ("integerValue" in valeur) return Number(valeur.integerValue);
    if ("arrayValue" in valeur) {
      return (valeur.arrayValue.values || []).map(v => depuisDocumentFirestore({ fields: v.mapValue.fields }));
    }
    return null;
  }

  // ==========================================================
  // NOMBRE EN LETTRES (FRANÇAIS)
  // ==========================================================
  const UNITES = ["", "un", "deux", "trois", "quatre", "cinq", "six", "sept", "huit", "neuf",
    "dix", "onze", "douze", "treize", "quatorze", "quinze", "seize", "dix-sept", "dix-huit", "dix-neuf"];
  const DIZAINES = ["", "", "vingt", "trente", "quarante", "cinquante", "soixante", "soixante-dix", "quatre-vingt", "quatre-vingt-dix"];

  function deuxChiffresEnLettres(n) {
    if (n < 20) return UNITES[n];
    const d = Math.floor(n / 10), u = n % 10;
    if (d === 7 || d === 9) {
      const base = d === 7 ? "soixante" : "quatre-vingt";
      const reste = 10 + u;
      return (u === 1 && d === 7) ? base + " et " + UNITES[reste] : base + "-" + UNITES[reste];
    }
    if (u === 0) return DIZAINES[d] + (d === 8 ? "s" : "");
    if (u === 1 && d !== 8) return DIZAINES[d] + " et un";
    return DIZAINES[d] + "-" + UNITES[u];
  }

  function troisChiffresEnLettres(n) {
    if (n === 0) return "";
    const c = Math.floor(n / 100), reste = n % 100;
    let mots = "";
    if (c > 0) {
      mots += (c === 1 ? "cent" : UNITES[c] + " cent") + (c > 1 && reste === 0 ? "s" : "");
      if (reste > 0) mots += " ";
    }
    if (reste > 0) mots += deuxChiffresEnLettres(reste);
    return mots;
  }

  function nombreEnLettres(n) {
    n = Math.round(n);
    if (n === 0) return "zéro";
    const groupes = [{ v: 1000000000, nom: "milliard" }, { v: 1000000, nom: "million" }, { v: 1000, nom: "mille" }];
    let mots = "", reste = n;
    for (const g of groupes) {
      const q = Math.floor(reste / g.v);
      if (q > 0) {
        mots += (g.nom === "mille" && q === 1) ? "mille " : troisChiffresEnLettres(q) + " " + g.nom + (q > 1 && g.nom !== "mille" ? "s" : "") + " ";
        reste %= g.v;
      }
    }
    if (reste > 0) mots += troisChiffresEnLettres(reste);
    mots = mots.trim().replace(/\s+/g, " ");
    return mots.charAt(0).toUpperCase() + mots.slice(1);
  }

  // ==========================================================
  // ENREGISTREMENT DU SERVICE WORKER (installabilité PWA)

    window.addEventListener("load", () => {
